<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sri Santhosh animated GitHub profile banner</title>
  <desc id="desc">Animated professional banner for an AI and ML student, full-stack builder, and internship candidate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/>
      <stop offset="0.48" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#071A2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="72" x2="1080" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4AA"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 198) rotate(90) scale(160)">
      <stop stop-color="#00D4AA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" stroke="#2F81F7" stroke-width="0.7" opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Space Grotesk', 'Segoe UI', Arial, sans-serif; }
      .eyebrow { fill: #7DD3FC; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
      .hero-title { fill: #F6F8FA; font-size: 62px; font-weight: 700; letter-spacing: 0; }
      .hero-subtitle { fill: #C9D1D9; font-size: 22px; font-weight: 500; }
      .terminal { fill: #7EE787; font-size: 20px; font-weight: 600; }
      .muted { fill: #8B949E; font-size: 16px; font-weight: 500; }
      .pill { fill: #0D1117; stroke: #30363D; stroke-width: 1.2; }
      .pill-text { fill: #F0F6FC; font-size: 14px; font-weight: 600; }
      .orbit-label { fill: #FFFFFF; font-size: 23px; font-weight: 700; }
      .small-label { fill: #C9D1D9; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)" opacity="0.32">
    <animate attributeName="opacity" values="0.18;0.34;0.18" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="420" rx="28" fill="url(#pulse)">
    <animate attributeName="opacity" values="0.45;0.88;0.45" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#glow)" opacity="0.62">
    <path d="M-40 326 C180 250 290 386 506 302 C744 210 855 262 1240 138" stroke="url(#accent)" stroke-width="2.2" stroke-dasharray="12 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-20 104 C222 54 402 164 615 118 C804 76 979 74 1228 154" stroke="#58A6FF" stroke-width="1.4" stroke-dasharray="7 14" opacity="0.58">
      <animate attributeName="stroke-dashoffset" from="0" to="210" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(72 64)">
    <text class="eyebrow" x="0" y="0">PROFILE SIGNAL / AI + FULL STACK</text>
    <text class="hero-title" x="0" y="72">Sri Santhosh</text>
    <text class="hero-subtitle" x="3" y="112">AI &amp; ML student - full-stack builder - Java + Python developer</text>

    <g transform="translate(0 146)">
      <rect class="pill" x="0" y="0" width="170" height="36" rx="18"/>
      <text class="pill-text" x="18" y="23">AI Agents &amp; LLMs</text>
      <circle cx="148" cy="18" r="5" fill="#00D4AA">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
      </circle>

      <rect class="pill" x="186" y="0" width="170" height="36" rx="18"/>
      <text class="pill-text" x="204" y="23">Machine Learning</text>
      <circle cx="338" cy="18" r="5" fill="#58A6FF">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>

      <rect class="pill" x="372" y="0" width="160" height="36" rx="18"/>
      <text class="pill-text" x="390" y="23">Full-Stack Dev</text>
      <circle cx="514" cy="18" r="5" fill="#A371F7">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="1.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(0 216)">
      <rect x="0" y="0" width="548" height="116" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="1.4"/>
      <circle cx="24" cy="24" r="6" fill="#FF7B72"/>
      <circle cx="44" cy="24" r="6" fill="#F2CC60"/>
      <circle cx="64" cy="24" r="6" fill="#7EE787"/>
      <text class="terminal" x="22" y="60">$ python train.py --epochs 10 --model transformer</text>
      <text class="muted" x="22" y="88">Epoch 10/10 | Loss: 0.042 | Acc: 98.5% | Ready for deploy</text>
      <rect x="22" y="100" width="72" height="3" rx="1.5" fill="#00D4AA">
        <animate attributeName="x" values="22;452;22" dur="5.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(784 62)" filter="url(#glow)">
    <circle cx="160" cy="145" r="124" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <circle cx="160" cy="145" r="104" stroke="url(#accent)" stroke-width="2" stroke-dasharray="18 22" opacity="0.88">
      <animateTransform attributeName="transform" type="rotate" from="0 160 145" to="360 160 145" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="145" r="68" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="6 12" opacity="0.78">
      <animateTransform attributeName="transform" type="rotate" from="360 160 145" to="0 160 145" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="145" r="48" fill="#071A2C" stroke="#00D4AA" stroke-width="1.2">
      <animate attributeName="r" values="46;53;46" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text class="orbit-label" x="160" y="139" text-anchor="middle">AI</text>
    <text class="small-label" x="160" y="164" text-anchor="middle">FULL STACK</text>

    <circle cx="160" cy="41" r="7" fill="#00D4AA">
      <animate attributeName="r" values="5;9;5" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="264" cy="145" r="7" fill="#58A6FF">
      <animate attributeName="r" values="9;5;9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="249" r="7" fill="#A371F7">
      <animate attributeName="r" values="5;9;5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="145" r="7" fill="#F2CC60">
      <animate attributeName="r" values="8;5;8" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <text class="small-label" x="160" y="24" text-anchor="middle">Python</text>
    <text class="small-label" x="306" y="150" text-anchor="middle">React</text>
    <text class="small-label" x="160" y="284" text-anchor="middle">AWS</text>
    <text class="small-label" x="15" y="150" text-anchor="middle">Java</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#accent)" stroke-width="2" opacity="0.72"/>
</svg>
