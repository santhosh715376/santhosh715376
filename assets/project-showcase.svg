<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated featured GitHub projects</title>
  <desc id="desc">A reliable local SVG showcase for Sri Santhosh's featured projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="1120" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4AA"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Space Grotesk', 'Segoe UI', Arial, sans-serif; }
      .label { fill: #7DD3FC; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; }
      .title { fill: #F6F8FA; font-size: 26px; font-weight: 700; }
      .card-title { fill: #F6F8FA; font-size: 18px; font-weight: 700; }
      .desc { fill: #C9D1D9; font-size: 13px; font-weight: 500; }
      .stack { fill: #00D4AA; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#bg)" stroke="#30363D"/>
  <path d="M58 304 C240 216 354 352 532 268 C720 180 902 220 1142 94" stroke="url(#accent)" stroke-width="2" stroke-dasharray="12 18" opacity="0.8" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="10s" repeatCount="indefinite"/>
  </path>
  <text class="label" x="64" y="48">FEATURED BUILD SIGNALS</text>
  <text class="title" x="64" y="84">Projects recruiters can scan quickly</text>

  <g transform="translate(64 118)">
    <rect width="330" height="84" rx="16" fill="#0D1117" stroke="#30363D"/>
    <rect width="330" height="84" rx="16" stroke="url(#accent)" opacity="0.42">
      <animate attributeName="opacity" values="0.18;0.7;0.18" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="28" cy="28" r="7" fill="#00D4AA" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text class="card-title" x="48" y="32">Smart Timetable Scheduler</text>
    <text class="desc" x="22" y="56">Conflict-free academic scheduling with OR-Tools</text>
    <text class="stack" x="22" y="74">React - Node.js - MySQL - Python</text>
  </g>

  <g transform="translate(434 118)">
    <rect width="330" height="84" rx="16" fill="#0D1117" stroke="#30363D"/>
    <rect width="330" height="84" rx="16" stroke="url(#accent)" opacity="0.42">
      <animate attributeName="opacity" values="0.7;0.18;0.7" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="28" cy="28" r="7" fill="#58A6FF" filter="url(#glow)">
      <animate attributeName="r" values="9;5;9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text class="card-title" x="48" y="32">AI Email Response Generator</text>
    <text class="desc" x="22" y="56">Summaries and context-aware replies with LLM flow</text>
    <text class="stack" x="22" y="74">Python - NLP - LLM Agents</text>
  </g>

  <g transform="translate(804 118)">
    <rect width="330" height="84" rx="16" fill="#0D1117" stroke="#30363D"/>
    <rect width="330" height="84" rx="16" stroke="url(#accent)" opacity="0.42">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="28" cy="28" r="7" fill="#A371F7" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text class="card-title" x="48" y="32">AQI Prediction App</text>
    <text class="desc" x="22" y="56">PM2.5 prediction using weather inputs</text>
    <text class="stack" x="22" y="74">Python - Flask - scikit-learn</text>
  </g>

  <g transform="translate(64 230)">
    <rect width="330" height="84" rx="16" fill="#0D1117" stroke="#30363D"/>
    <rect width="330" height="84" rx="16" stroke="url(#accent)" opacity="0.42">
      <animate attributeName="opacity" values="0.75;0.25;0.75" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="28" cy="28" r="7" fill="#F2CC60" filter="url(#glow)">
      <animate attributeName="r" values="8;5;8" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <text class="card-title" x="48" y="32">Credit Card Fraud Detection</text>
    <text class="desc" x="22" y="56">Preprocessing, ML detection, and evaluation metrics</text>
    <text class="stack" x="22" y="74">Python - ML - Data Analysis</text>
  </g>

  <g transform="translate(434 230)">
    <rect width="330" height="84" rx="16" fill="#0D1117" stroke="#30363D"/>
    <rect width="330" height="84" rx="16" stroke="url(#accent)" opacity="0.42">
      <animate attributeName="opacity" values="0.22;0.68;0.22" dur="5.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="28" cy="28" r="7" fill="#00D4AA" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <text class="card-title" x="48" y="32">Fee Management System</text>
    <text class="desc" x="22" y="56">Database-backed fee records and payment workflow</text>
    <text class="stack" x="22" y="74">Java - MySQL - JDBC</text>
  </g>

  <g transform="translate(804 230)">
    <rect width="330" height="84" rx="16" fill="#0D1117" stroke="#30363D"/>
    <rect width="330" height="84" rx="16" stroke="url(#accent)" opacity="0.42">
      <animate attributeName="opacity" values="0.65;0.22;0.65" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="28" cy="28" r="7" fill="#58A6FF" filter="url(#glow)">
      <animate attributeName="r" values="8;5;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text class="card-title" x="48" y="32">AWS Mini Capstone</text>
    <text class="desc" x="22" y="56">EC2, IIS hosting, security groups, and Elastic IP</text>
    <text class="stack" x="22" y="74">AWS - EC2 - IIS</text>
  </g>
</svg>
