<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated technology flow</title>
  <desc id="desc">Animated technology map showing Sri Santhosh's core tools and learning direction.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.54" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4AA"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Space Grotesk', 'Segoe UI', Arial, sans-serif; }
      .heading { fill: #F6F8FA; font-size: 24px; font-weight: 700; }
      .sub { fill: #8B949E; font-size: 14px; font-weight: 500; }
      .tag { fill: #F0F6FC; font-size: 16px; font-weight: 700; }
      .layer { fill: #0D1117; stroke: #30363D; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="228" rx="24" fill="url(#panel)" stroke="#30363D"/>
  <text class="heading" x="70" y="48">Tech stack in motion</text>
  <text class="sub" x="70" y="72">Product layer: AI/ML + full-stack + cloud fundamentals</text>

  <path d="M78 128 H1122" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 14" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#00D4AA" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M78 128 H1122"/>
  </circle>
  <circle r="5" fill="#A371F7" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite" path="M1122 128 H78"/>
  </circle>

  <g transform="translate(60 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4.2s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="90" height="52" rx="18"/>
      <text class="tag" x="45" y="32" text-anchor="middle">Python</text>
    </g>
  </g>
  <g transform="translate(166 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -7; 0 0; 0 -7" dur="4.6s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="96" height="52" rx="18"/>
      <text class="tag" x="48" y="32" text-anchor="middle">PyTorch</text>
    </g>
  </g>
  <g transform="translate(278 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="4.8s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="120" height="52" rx="18"/>
      <text class="tag" x="60" y="32" text-anchor="middle">TensorFlow</text>
    </g>
  </g>
  <g transform="translate(414 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -6; 0 0; 0 -6" dur="5.1s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="124" height="52" rx="18"/>
      <text class="tag" x="62" y="32" text-anchor="middle">scikit-learn</text>
    </g>
  </g>
  <g transform="translate(554 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4.4s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="76" height="52" rx="18"/>
      <text class="tag" x="38" y="32" text-anchor="middle">Java</text>
    </g>
  </g>
  <g transform="translate(646 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -8; 0 0; 0 -8" dur="4.9s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="86" height="52" rx="18"/>
      <text class="tag" x="43" y="32" text-anchor="middle">React</text>
    </g>
  </g>
  <g transform="translate(748 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5.3s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="96" height="52" rx="18"/>
      <text class="tag" x="48" y="32" text-anchor="middle">Node.js</text>
    </g>
  </g>
  <g transform="translate(860 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -6; 0 0; 0 -6" dur="4.1s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="86" height="52" rx="18"/>
      <text class="tag" x="43" y="32" text-anchor="middle">MySQL</text>
    </g>
  </g>
  <g transform="translate(962 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="5.2s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="96" height="52" rx="18"/>
      <text class="tag" x="48" y="32" text-anchor="middle">FastAPI</text>
    </g>
  </g>
  <g transform="translate(1074 102)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -5; 0 0; 0 -5" dur="4.5s" repeatCount="indefinite"/>
      <rect class="layer" x="0" y="0" width="76" height="52" rx="18"/>
      <text class="tag" x="38" y="32" text-anchor="middle">AWS</text>
    </g>
  </g>

  <text class="sub" x="70" y="194">Focus: deep learning pipelines, custom agents, full-stack deployment, and cloud architectures.</text>
</svg>
